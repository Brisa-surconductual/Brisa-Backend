name: Postman RF-148

on:
  pull_request:
    branches: [develop, test, master]

permissions:
  contents: read

jobs:
  solo-lectura:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: brisa_rf148_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd 'pg_isready -U postgres'
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/brisa_rf148_ci
      RF148_NEWMAN_DIR: ${{ runner.temp }}/rf148-newman

    steps:
      - name: Obtener el código
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Configurar Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci --ignore-scripts

      - name: Preparar PostgreSQL y Prisma
        run: |
          node node_modules/prisma/build/index.js migrate deploy
          node node_modules/prisma/build/index.js generate

      - name: Instalar Newman
        run: npm install --prefix "$RF148_NEWMAN_DIR" --no-save --no-package-lock --ignore-scripts newman@6.2.1

      - name: Ejecutar Postman y comprobar la bitácora
        run: node -r ts-node/register/transpile-only -r tsconfig-paths/register test/administrativo/postman/ejecutar-rf148.cjs

name: Generate Prisma Schema

# schema.prisma es un artefacto AUTOGENERADO: nadie lo edita a mano.
# Los devs solo escriben SQL en prisma/migrations/*/migration.sql.
# Al hacer merge (push) a develop, test o master, se aplican las migraciones
# a una DB efimera, se hace `prisma db pull` y se commitea el schema resultante.
on:
  push:
    branches:
      - test
      - master
      - develop
    paths:
      - 'prisma/migrations/**'
  workflow_dispatch:

permissions:
  contents: write # necesario para commitear el schema generado

concurrency:
  group: prisma-generate-schema-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate-schema:
    name: Regenerate schema.prisma from migrations
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: prisma_schema_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/prisma_schema_db?schema=public

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Apply migrations to ephemeral DB
        run: npx prisma migrate deploy --schema prisma/schema.prisma

      - name: Introspect DB into schema.prisma
        run: |
          npx prisma db pull --schema prisma/schema.prisma
          npx prisma format --schema prisma/schema.prisma
          npx prisma validate --schema prisma/schema.prisma

      - name: Commit generated schema if changed
        run: |
          if git diff --quiet -- prisma/schema.prisma; then
            echo "schema.prisma ya esta al dia."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prisma/schema.prisma
          git commit -m "chore(prisma): regenerar schema.prisma desde migraciones [skip ci]"
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"

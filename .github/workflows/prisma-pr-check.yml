name: Prisma PR Check

on:
  pull_request:
    branches:
      - master
      - main
      - test

permissions:
  contents: read

concurrency:
  group: prisma-pr-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-migrations:
    name: Prisma migration check
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: prisma_test_db
        ports:
          - 5432:5432
        # Espera a que Postgres esté listo antes de correr los tests
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/prisma_test_db?schema=public

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm' # O 'yarn' / 'pnpm' según lo que uses

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npx prisma validate --schema prisma/schema.prisma


      - name: Check for migration drift
        run: |
          npx prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema-datamodel prisma/schema.prisma \
            --script \
            --exit-code

      - name: Test applying migrations to ephemeral DB
        run: npx prisma migrate deploy --schema prisma/schema.prisma
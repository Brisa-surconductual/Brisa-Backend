name: Deploy migrations to Test

# develop y test comparten la misma base de datos (secreto TEST_DATABASE_URL
# del Environment "test"); develop es donde se integra el trabajo diario.
on:
  push:
    branches:
      - test
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-migrations-test
  cancel-in-progress: false

jobs:
  deploy-test:
    name: Apply migrations to Test DB
    runs-on: ubuntu-latest

    # Opcional: puedes usar GitHub Environment llamado "test"
    environment: test

    env:
      DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          # cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate --schema prisma/schema.prisma

      - name: Apply Prisma migrations
        run: npx prisma migrate deploy --schema prisma/schema.prisma
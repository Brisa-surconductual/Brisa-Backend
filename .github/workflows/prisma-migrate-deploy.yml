name: Deploy Prisma Migrations to Main (manual)

# En cada push a master las migraciones de produccion las aplica el job
# `migrate` de backend.yml, antes del deploy a Render. Este workflow queda
# solo para ejecutarlo a mano desde Actions si hace falta re-aplicarlas.
on:
  workflow_dispatch:

jobs:
  deploy-migrations:
    name: Run Prisma Migrations
    runs-on: ubuntu-latest

    # Debe ser el Environment de produccion, NO "test": los secretos del
    # Environment tienen prioridad sobre los del repositorio, asi que con
    # "test" se resolvia la URL de la DB de test.
    environment: deploy

    concurrency:
      group: deploy-migrations-production
      cancel-in-progress: false

    env:
      # Secreto del Environment "production" con la URL de la DB de produccion.
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      # 1. Descargar el código del repositorio
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Configurar Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Cambia esto si usas otra versión de Node
          cache: 'npm'       # Cambia a 'yarn' o 'pnpm' si usas otro gestor

      # 3. Instalar dependencias (usamos 'ci' para que sea más rápido y exacto)
      - name: Install dependencies
        run: npm ci

      # 4. Generar el cliente de Prisma (Recomendado antes de migrar)
      - name: Generate Prisma Client
        run: npx prisma generate

      # 5. Ejecutar las migraciones en la base de datos
      - name: Apply database migrations
        run: npx prisma migrate deploy